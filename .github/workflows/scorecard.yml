name: scorecard

on:
  pull_request:
    paths:
      - ".github/workflows/scorecard.yml"
  branch_protection_rule:
  schedule:
    - cron: "32 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: run scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload scorecard results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: validate scorecard without publishing
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: verify SARIF output
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("results.sarif").read_text())
          assert report["version"] == "2.1.0", "Unexpected SARIF version"
          assert report["runs"], "Scorecard produced no SARIF runs"
          assert all(run["tool"]["driver"]["name"] for run in report["runs"])
          PYTHON
