global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: ink-local
rule_files: [rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: ink-api
    static_configs:
      - targets: [host.docker.internal:9091]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: blackbox
    static_configs:
      - targets: [blackbox:9115]
  - job_name: ink-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://host.docker.internal:8080/healthz]
        labels:
          endpoint: healthz
      - targets: [http://host.docker.internal:8080/readyz]
        labels:
          endpoint: readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
