rule_files: [rules.yml]
evaluation_interval: 1m
tests:
  - name: missing scrape and each missing probe are detected
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: InkMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: ink-api, severity: critical}
            exp_annotations: {summary: Ink metrics scrape is unavailable}
      - eval_time: 3m
        alertname: InkProbeFailed
        exp_alerts:
          - exp_labels: {job: ink-probe, endpoint: healthz, severity: critical}
            exp_annotations: {summary: Ink health or readiness probe is unavailable}
          - exp_labels: {job: ink-probe, endpoint: readyz, severity: critical}
            exp_annotations: {summary: Ink health or readiness probe is unavailable}
  - name: failed scrape and failed health probe retain target identity
    interval: 1m
    input_series:
      - series: 'up{job="ink-api",instance="api"}'
        values: '0x5'
      - series: 'probe_success{job="ink-probe",instance="health",endpoint="healthz"}'
        values: '0x5'
      - series: 'probe_success{job="ink-probe",instance="ready",endpoint="readyz"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: InkMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: ink-api, instance: api, severity: critical}
            exp_annotations: {summary: Ink metrics scrape is unavailable}
      - eval_time: 3m
        alertname: InkProbeFailed
        exp_alerts:
          - exp_labels: {job: ink-probe, instance: health, endpoint: healthz, severity: critical}
            exp_annotations: {summary: Ink health or readiness probe is unavailable}
  - name: running worker stalls independent of six hour janitor interval
    interval: 1m
    input_series:
      - series: 'ink_worker_last_scan_started_timestamp_seconds{job="ink-api",instance="api",worker="janitor"}'
        values: '1x12'
      - series: 'ink_worker_scan_in_progress{job="ink-api",instance="api",worker="janitor"}'
        values: '1x12'
      - series: 'ink_worker_poll_interval_seconds{job="ink-api",instance="api",worker="janitor"}'
        values: '21600x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: InkWorkerRunningStalled
        exp_alerts: []
      - eval_time: 8m
        alertname: InkWorkerRunningStalled
        exp_alerts:
          - exp_labels: {job: ink-api, instance: api, worker: janitor, severity: warning}
            exp_annotations: {summary: Ink worker scan has run for over five minutes}
      - eval_time: 8m
        alertname: InkWorkerIdleStalled
        exp_alerts: []
  - name: idle janitor is healthy for six hours but alerts after two missed intervals
    interval: 1m
    input_series:
      - series: 'ink_worker_last_scan_completed_timestamp_seconds{job="ink-api",instance="api",worker="janitor"}'
        values: '1x730'
      - series: 'ink_worker_scan_in_progress{job="ink-api",instance="api",worker="janitor"}'
        values: '0x730'
      - series: 'ink_worker_poll_interval_seconds{job="ink-api",instance="api",worker="janitor"}'
        values: '21600x730'
    alert_rule_test:
      - eval_time: 360m
        alertname: InkWorkerIdleStalled
        exp_alerts: []
      - eval_time: 728m
        alertname: InkWorkerIdleStalled
        exp_alerts:
          - exp_labels: {job: ink-api, instance: api, worker: janitor, severity: warning}
            exp_annotations: {summary: Ink idle worker missed two poll intervals plus five minutes}
  - name: backlog replicas are max not sum and human waiting queues never alert
    interval: 1m
    input_series:
      - series: 'ink_backlog_items{job="ink-api",instance="a",queue="schedule"}'
        values: '7x40'
      - series: 'ink_backlog_items{job="ink-api",instance="b",queue="schedule"}'
        values: '7x40'
      - series: 'ink_backlog_oldest_due_timestamp_seconds{job="ink-api",instance="a",queue="schedule"}'
        values: '1x40'
      - series: 'ink_backlog_oldest_due_timestamp_seconds{job="ink-api",instance="b",queue="schedule"}'
        values: '61x40'
      - series: 'ink_backlog_items{job="ink-api",queue="pending_confirmation"}'
        values: '99x40'
      - series: 'ink_backlog_oldest_due_timestamp_seconds{job="ink-api",queue="pending_confirmation"}'
        values: '1x40'
      - series: 'ink_backlog_items{job="ink-api",queue="submitted_print"}'
        values: '99x40'
      - series: 'ink_backlog_oldest_due_timestamp_seconds{job="ink-api",queue="submitted_print"}'
        values: '1x40'
      - series: 'ink_backlog_items{job="ink-api",queue="plugin_fetch"}'
        values: '3x40'
      - series: 'ink_backlog_oldest_due_timestamp_seconds{job="ink-api",queue="plugin_fetch"}'
        values: '0x40'
      - series: 'ink_backlog_items{job="ink-api",queue="print_status"}'
        values: '0x40'
      - series: 'ink_backlog_oldest_due_timestamp_seconds{job="ink-api",queue="print_status"}'
        values: '1x40'
    promql_expr_test:
      - expr: 'ink:backlog_items:max{queue="schedule"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ink:backlog_items:max{queue="schedule"}'
            value: 7
      - expr: 'ink:backlog_due_age_seconds:max{queue="schedule"}'
        eval_time: 30m
        exp_samples:
          - labels: 'ink:backlog_due_age_seconds:max{queue="schedule"}'
            value: 1799
      - expr: 'ink:backlog_due_age_seconds:max{queue="plugin_fetch"}'
        eval_time: 30m
        exp_samples: []
    alert_rule_test:
      - eval_time: 30m
        alertname: InkActionableBacklogOld
        exp_alerts:
          - exp_labels: {queue: schedule, severity: warning}
            exp_annotations: {summary: Actionable Ink queue has overdue work older than fifteen minutes}
  - name: sustained API errors alert but probe errors and sparse traffic do not
    interval: 1m
    input_series:
      - series: 'ink_http_requests_total{job="ink-api",instance="busy",route="/api/prints",status="500"}'
        values: '0+2x20'
      - series: 'ink_http_requests_total{job="ink-api",instance="busy",route="/api/prints",status="200"}'
        values: '0+18x20'
      - series: 'ink_http_requests_total{job="ink-api",instance="sparse",route="/api/prints",status="500"}'
        values: '0+1x20'
      - series: 'ink_http_requests_total{job="ink-api",instance="probe",route="/readyz",status="503"}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: InkAPIHigh5xx
        exp_alerts: []
      - eval_time: 10m
        alertname: InkAPIHigh5xx
        exp_alerts:
          - exp_labels: {instance: busy, severity: warning}
            exp_annotations: {summary: Business API 5xx exceeds 5 percent with at least 20 requests per five minutes}
  - name: panic counter reset alone does not alert and pool pressure requires persistence
    interval: 1m
    input_series:
      - series: 'ink_http_panics_total{job="ink-api",instance="reset"}'
        values: '5 5 0 0 0 0'
      - series: 'ink_http_panics_total{job="ink-api",instance="panic"}'
        values: '0 0 1 1 1 1'
      - series: 'ink_db_pool_acquired_connections{job="ink-api",instance="api"}'
        values: '9x15'
      - series: 'ink_db_pool_max_connections{job="ink-api",instance="api"}'
        values: '10x15'
    alert_rule_test:
      - eval_time: 3m
        alertname: InkHTTPPanic
        exp_alerts:
          - exp_labels: {job: ink-api, instance: panic, severity: critical}
            exp_annotations: {summary: Ink HTTP handler panicked}
      - eval_time: 5m
        alertname: InkDBPoolPressure
        exp_alerts: []
      - eval_time: 11m
        alertname: InkDBPoolPressure
        exp_alerts:
          - exp_labels: {job: ink-api, instance: api, severity: warning}
            exp_annotations: {summary: Ink database pool utilization exceeds 85 percent}
  - name: operation errors and stale sampler fire while a fresh replica prevents stale alert
    interval: 1m
    input_series:
      - series: 'ink_operations_total{job="ink-api",operation="print",result="error"}'
        values: '0+2x25'
      - series: 'ink_operations_total{job="ink-api",operation="print",result="success"}'
        values: '0+8x25'
      - series: 'ink_backlog_last_success_timestamp_seconds{job="ink-api",instance="old"}'
        values: '0x25'
      - series: 'ink_backlog_last_success_timestamp_seconds{job="ink-api",instance="fresh"}'
        values: '0+60x25'
      - series: 'ink_backlog_sample_errors_total{job="ink-api"}'
        values: '0+1x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: InkOperationErrors
        exp_alerts:
          - exp_labels: {operation: print, severity: warning}
            exp_annotations: {summary: Ink operation errors exceed 10 percent with at least ten attempts per ten minutes}
      - eval_time: 20m
        alertname: InkBacklogSamplerStale
        exp_alerts: []
      - eval_time: 20m
        alertname: InkBacklogSampleErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Ink backlog sampling is failing}
  - name: missing sampler is unknown not healthy
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: InkBacklogSamplerStale
        exp_alerts:
          - exp_labels: {job: ink-api, severity: warning}
            exp_annotations: {summary: No successful Ink backlog sample for five minutes}
  - name: stale sampler and slow operation histogram
    interval: 1m
    input_series:
      - series: 'ink_backlog_last_success_timestamp_seconds{job="ink-api"}'
        values: '1x25'
      - series: 'ink_operation_duration_seconds_bucket{job="ink-api",operation="fetch",le="60"}'
        values: '0+0x25'
      - series: 'ink_operation_duration_seconds_bucket{job="ink-api",operation="fetch",le="120"}'
        values: '0+10x25'
      - series: 'ink_operation_duration_seconds_bucket{job="ink-api",operation="fetch",le="+Inf"}'
        values: '0+10x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: InkBacklogSamplerStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: No successful Ink backlog sample for five minutes}
      - eval_time: 20m
        alertname: InkOperationSlow
        exp_alerts:
          - exp_labels: {operation: fetch, severity: warning}
            exp_annotations: {summary: Ink operation p95 exceeds sixty seconds}
