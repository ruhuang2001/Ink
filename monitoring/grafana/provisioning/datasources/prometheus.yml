apiVersion: 1
datasources:
  - name: Ink Prometheus
    uid: ink-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Ink Tempo (optional tracing profile)
    uid: ink-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
  - name: Ink Logs (optional logging profile)
    uid: ink-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          datasourceUid: ink-tempo
          url: '$${__value.raw}'
